name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Fast Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --build-cache --configure-on-demand -x lint -x test -x lintVitalRelease -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC"

      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/expense-tracker-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: release/expense-tracker-debug.apk
          compression-level: 0

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Expense Tracker APK (Latest)
          prerelease: true
          overwrite_files: true
          files: release/expense-tracker-debug.apk
          body: |
            Auto-generated from commit ${{ github.sha }}.
            Download this APK for the latest wrapped web app build.

