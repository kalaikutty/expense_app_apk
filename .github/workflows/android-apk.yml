name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/expense_tracker_b${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release/expense-tracker-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense_tracker_b${{ github.run_number }}
          path: release/expense_tracker_b${{ github.run_number }}.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Expense Tracker APK (Build #${{ github.run_number }})
          prerelease: true
          overwrite_files: true
          files: |
            release/expense_tracker_b${{ github.run_number }}.apk
            release/expense-tracker-debug.apk
          body: |
            Latest Build APK Release: Auto-generated from Build #${{ github.run_number }} (commit ${{ github.sha }}).
            Download expense_tracker_b${{ github.run_number }}.apk for the latest successful build artifact.


